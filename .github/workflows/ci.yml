name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U app -d app_test"
          --health-interval=5s --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: deps
        run: go mod download

      - name: vet
        run: go vet ./...

      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/api

      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: audit
        run: pnpm audit --prod || true

  contract:
    name: contrato (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i -g @stoplight/spectral-cli
      - run: spectral lint docs/api/openapi.yaml

  spec-drift:
    name: spec drift
    runs-on: ubuntu-latest
    needs: [api, web, contract]
    steps:
      - uses: actions/checkout@v4
      - name: confirma que cada PR toca specs/ ao mudar API
        run: |
          if git diff --name-only origin/main... | grep -E '^docs/api/openapi.yaml$' >/dev/null; then
            if ! git diff --name-only origin/main... | grep -E '^specs/' >/dev/null; then
              echo "::warning::OpenAPI mudou mas nenhum arquivo em specs/ foi tocado. Lembre-se: o contrato segue uma spec."
            fi
          fi
